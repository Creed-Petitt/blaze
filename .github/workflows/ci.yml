name: Blaze CI

on:
  push:
    branches: [ main, ci-pipeline, feature/* ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ pkg-config

    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: brew install cmake pkg-config

    - name: Cache Build Dependencies
      uses: actions/cache@v3
      with:
        path: build/_deps
        key: ${{ runner.os }}-build-deps-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-build-deps-

    - name: Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --target blaze_tests -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Run Catch2 Suite
      run: ./build/tests/blaze_tests

  fuzzing-libfuzzer:
    name: Internal Fuzzing (LibFuzzer)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ clang llvm pkg-config
        
    - name: Build Fuzzers
      run: |
        cmake -B build -DCMAKE_CXX_COMPILER=clang++ -DBLAZE_BUILD_FUZZERS=ON
        cmake --build build -j$(nproc)
        
    - name: Fuzz URL Decoder
      run: ./build/tests/fuzzers/fuzz_url -max_total_time=60
      
    - name: Fuzz JSON Parser
      run: ./build/tests/fuzzers/fuzz_json -max_total_time=60

  lint:
    name: Static Analysis (Clang-Tidy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ clang-tidy
        
    - name: Configure CMake
      run: cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      
    - name: Run Clang-Tidy
      run: clang-tidy -p build framework/src/*.cpp framework/src/util/*.cpp

  sanitizer-pass:
    name: Memory Safety (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ pkg-config

    - name: Build with Sanitizers
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBLAZE_ENABLE_SANITIZERS=ON
        cmake --build build -j$(nproc)

    - name: Run Sanitized Unit Tests
      run: ./build/tests/blaze_tests

  thread-safety:
    name: Thread Safety (TSan)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ pkg-config

    - name: Build with TSan
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBLAZE_ENABLE_TSAN=ON
        cmake --build build -j$(nproc)

    - name: Run TSan Unit Tests
      run: TSAN_OPTIONS="suppressions=tools/tsan.supp" ./build/tests/blaze_tests
